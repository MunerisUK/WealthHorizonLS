name: Install or update problem
description: WealthHorizon will not install, start or update.
labels: [install]
body:
  - type: markdown
    attributes:
      value: |
        **This repository is public.** Anything you write here can be read by anyone.
        Do not include balances, account names, payslips, licence keys, passwords or anything from your `.env` file.
        For a problem inside the app, use its Feedback page instead.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you post
      options:
        - label: I have removed my licence key, passwords and any personal or financial details.
          required: true
  - type: input
    id: build
    attributes:
      label: Build
      description: The image tag you are running, for example B1070 or latest.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: What it runs on
      description: For example "Synology DS920+, DSM 7.2" or "Ubuntu 24.04, x86-64".
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The output of `docker compose logs --tail 100 api`. Check it for anything personal before posting.
      render: text
